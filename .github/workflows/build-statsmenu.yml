name: Build StatsMenu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project
        run: |
          mkdir -p statsmenu/src/main/java/ru/eclips/statsmenu
          mkdir -p statsmenu/src/main/resources
          cd statsmenu

          cat > pom.xml <<'EOF_POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.eclips</groupId>
            <artifactId>statsmenu</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>

            <properties>
              <maven.compiler.release>17</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <nukkit.group>cn.nukkit</nukkit.group>
              <nukkit.artifact>Nukkit</nukkit.artifact>
              <nukkit.version>MOT-SNAPSHOT</nukkit.version>
            </properties>

            <repositories>
              <repository>
                <id>lanink</id>
                <url>https://repo.lanink.cn/repository/maven-public/</url>
                <releases><enabled>true</enabled></releases>
                <snapshots><enabled>true</enabled></snapshots>
              </repository>
              <repository>
                <id>opencollab-release</id>
                <url>https://repo.opencollab.dev/maven-releases/</url>
              </repository>
              <repository>
                <id>opencollab-snapshot</id>
                <url>https://repo.opencollab.dev/maven-snapshots/</url>
                <releases><enabled>false</enabled></releases>
                <snapshots><enabled>true</enabled></snapshots>
              </repository>
              <repository>
                <id>jitpack</id>
                <url>https://jitpack.io</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>${nukkit.group}</groupId>
                <artifactId>${nukkit.artifact}</artifactId>
                <version>${nukkit.version}</version>
                <scope>provided</scope>
              </dependency>
              <dependency>
                <groupId>com.google.code.gson</groupId>
                <artifactId>gson</artifactId>
                <version>2.10.1</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <finalName>StatsMenu</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.11.0</version>
                  <configuration>
                    <release>17</release>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF_POM

          cat > src/main/resources/plugin.yml <<'EOF_PLUGIN'
          name: StatsMenu
          main: ru.eclips.statsmenu.StatsPlugin
          version: 1.0.0
          api: ["1.0.0"]
          author: Eclips
          description: Статистика активности игроков (/ss)
          commands:
            ss:
              description: Меню статистики игроков
              usage: /ss
              permission: ss.use
          permissions:
            ss.use:
              description: Доступ к меню статистики /ss
              default: op
          EOF_PLUGIN

          cat > src/main/resources/config.yml <<'EOF_CONFIG'
          # ===== StatsMenu: настройки статистики =====

          # Если игрок перезашёл в течение этого числа секунд после выхода
          # (хаб, RedirectCMD, HubPortal, вылет), это считается ОДНОЙ сессией.
          session-merge-seconds: 60

          # Как часто (в секундах) сохранять статистику на диск.
          # Сохранение выполняется асинхронно и не нагружает основной поток.
          save-interval-seconds: 60

          # "Вернулся 3+ раза": минимальное число сессий игрока (показатель №4).
          returning-sessions: 3

          # "Вернулся 20+ раз": минимальное число сессий игрока (показатель №5).
          loyal-sessions: 20

          # Игрок с одной сессией считается "не вернувшимся" только если
          # прошло больше стольких часов с его выхода (показатель №3).
          bounce-grace-hours: 24

          # Сколько дней без захода считать, что игрок ушёл (показатель №9).
          inactive-days: 7

          # Сколько ников показывать на одной странице списка.
          page-size: 10

          # Ники, которых нужно НЕ учитывать в статистике (например, админы или тестовые аккаунты).
          # Пример: exclude-names: ["Admin", "TestUser"]
          exclude-names: []

          # Часовой пояс для дат в меню, например "Europe/Moscow" или "Europe/Oslo".
          # Пусто = часовой пояс сервера.
          timezone: ""

          # ===== Показатели по времени суток (онлайн, пик, прайм-тайм) =====

          # Часовой пояс, по которому считаются сутки, окно онлайна и прайм-тайм.
          msk-zone: "Europe/Moscow"

          # Окно для показателя "Онлайн" (часы 0-24): 7 и 22 = с 07:00 до 22:00.
          day-window-start-hour: 7
          day-window-end-hour: 22

          # Длина прайм-тайма в часах (целое число от 1 до 12).
          prime-length-hours: 2

          # Сколько процентов от пикового онлайна считать "держит онлайн" (50-100).
          prime-peak-threshold-percent: 90
          EOF_CONFIG

          cat > src/main/java/ru/eclips/statsmenu/Fmt.java <<'EOF_FMT'
          package ru.eclips.statsmenu;

          import java.time.Instant;
          import java.time.ZoneId;
          import java.time.format.DateTimeFormatter;
          import java.util.Locale;

          public final class Fmt {

              private static final DateTimeFormatter FULL = DateTimeFormatter.ofPattern("dd.MM.yyyy HH:mm");
              private static final DateTimeFormatter SHORT = DateTimeFormatter.ofPattern("dd.MM HH:mm");

              private Fmt() {
              }

              public static String dur(long ms) {
                  if (ms < 0) {
                      ms = 0;
                  }
                  long h = ms / 3600000L;
                  long m = (ms % 3600000L) / 60000L;
                  long s = (ms % 60000L) / 1000L;
                  if (h > 0) {
                      return h + "ч " + m + "м";
                  }
                  if (m > 0) {
                      return m + "м " + s + "с";
                  }
                  return s + "с";
              }

              public static String date(long t, ZoneId z) {
                  return FULL.format(Instant.ofEpochMilli(t).atZone(z));
              }

              public static String dateS(long t, ZoneId z) {
                  return SHORT.format(Instant.ofEpochMilli(t).atZone(z));
              }

              public static String pct(long a, long b) {
                  if (b <= 0) {
                      return "0.0%";
                  }
                  return String.format(Locale.ROOT, "%.1f%%", 100.0 * a / b);
              }

              public static String f1(double d) {
                  return String.format(Locale.ROOT, "%.1f", d);
              }

              public static String f2(double d) {
                  return String.format(Locale.ROOT, "%.2f", d);
              }
          }
          EOF_FMT

          cat > src/main/java/ru/eclips/statsmenu/Store.java <<'EOF_STORE'
          package ru.eclips.statsmenu;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.io.Reader;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.IdentityHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Objects;
          import java.util.Set;
          import java.util.function.Function;

          public class Store {

              public static class Session {
                  public long s;
                  public long e;
              }

              public static class Rec {
                  public int id;
                  public String name = "";
                  public String xuid = "";
                  public long first;
                  public List<Session> ses = new ArrayList<>();
              }

              public static class Root {
                  public int v = 1;
                  public long startedAt;
                  public int nextId = 1;
                  public List<Rec> players = new ArrayList<>();
              }

              private static class Online {
                  Rec rec;
                  Session ses;
              }

              private final Object lock = new Object();
              private final Object ioLock = new Object();
              private final File file;
              private final Gson gson = new GsonBuilder().create();

              private final List<Rec> all = new ArrayList<>();
              private final Map<Integer, Rec> byId = new HashMap<>();
              private final Map<String, Rec> byName = new HashMap<>();
              private final Map<String, Rec> byXuid = new HashMap<>();
              private final Map<String, Online> online = new HashMap<>();

              private long startedAt;
              private int nextId = 1;
              private long gapMs = 60000L;
              private boolean dirty = false;

              public Store(File file) {
                  this.file = file;
              }

              public void setGapMs(long ms) {
                  synchronized (lock) {
                      gapMs = ms;
                  }
              }

              public void load() {
                  synchronized (lock) {
                      Root root = null;
                      boolean fromMain = false;
                      File bak = new File(file.getPath() + ".bak");
                      File[] candidates = new File[]{file, bak};
                      for (File f : candidates) {
                          if (!f.isFile()) {
                              continue;
                          }
                          try (Reader r = new InputStreamReader(new FileInputStream(f), StandardCharsets.UTF_8)) {
                              root = gson.fromJson(r, Root.class);
                          } catch (Throwable t) {
                              root = null;
                          }
                          if (root != null) {
                              fromMain = (f == file);
                              break;
                          } else if (f == file) {
                              try {
                                  Files.copy(file.toPath(),
                                          new File(file.getPath() + ".broken-" + System.currentTimeMillis()).toPath(),
                                          StandardCopyOption.REPLACE_EXISTING);
                              } catch (Throwable ignored) {
                              }
                          }
                      }
                      if (root == null) {
                          root = new Root();
                      }
                      long now = System.currentTimeMillis();
                      if (root.startedAt <= 0) {
                          root.startedAt = now;
                          dirty = true;
                      }
                      startedAt = root.startedAt;

                      all.clear();
                      byId.clear();
                      byName.clear();
                      byXuid.clear();

                      int maxId = 0;
                      if (root.players != null) {
                          for (Rec r : root.players) {
                              if (r != null && r.id > maxId) {
                                  maxId = r.id;
                              }
                          }
                      }
                      int next = Math.max(Math.max(1, root.nextId), maxId + 1);

                      if (root.players != null) {
                          for (Rec r : root.players) {
                              if (r == null) {
                                  continue;
                              }
                              if (r.name == null) {
                                  r.name = "";
                              }
                              if (r.xuid == null) {
                                  r.xuid = "";
                              }
                              if (r.ses == null) {
                                  r.ses = new ArrayList<>();
                              }
                              r.ses.removeIf(Objects::isNull);
                              for (Session s : r.ses) {
                                  if (s.e < s.s) {
                                      s.e = s.s;
                                  }
                              }
                              Collections.sort(r.ses, new Comparator<Session>() {
                                  @Override
                                  public int compare(Session a, Session b) {
                                      return Long.compare(a.s, b.s);
                                  }
                              });
                              if (r.first <= 0) {
                                  r.first = r.ses.isEmpty() ? now : r.ses.get(0).s;
                              }
                              if (r.id <= 0 || byId.containsKey(r.id)) {
                                  r.id = next++;
                              }
                              all.add(r);
                              byId.put(r.id, r);
                              if (!r.name.isEmpty()) {
                                  byName.put(r.name.toLowerCase(Locale.ROOT), r);
                              }
                              if (!r.xuid.isEmpty()) {
                                  byXuid.put(r.xuid, r);
                              }
                          }
                      }
                      nextId = next;

                      if (fromMain) {
                          try {
                              Files.copy(file.toPath(), bak.toPath(), StandardCopyOption.REPLACE_EXISTING);
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }

              private Rec find(String name, String xuid) {
                  String key = name.toLowerCase(Locale.ROOT);
                  Rec r = null;
                  if (!xuid.isEmpty()) {
                      r = byXuid.get(xuid);
                  }
                  if (r == null) {
                      Rec n = byName.get(key);
                      if (n != null && (n.xuid.isEmpty() || xuid.isEmpty() || n.xuid.equals(xuid))) {
                          r = n;
                      }
                  }
                  if (r != null) {
                      if (!xuid.isEmpty() && r.xuid.isEmpty()) {
                          r.xuid = xuid;
                          byXuid.put(xuid, r);
                      }
                      if (!r.name.equals(name)) {
                          r.name = name;
                          byName.put(key, r);
                      }
                  }
                  return r;
              }

              private Rec create(String name, String xuid, long now) {
                  Rec r = new Rec();
                  r.id = nextId++;
                  r.name = name;
                  r.xuid = xuid;
                  r.first = now;
                  all.add(r);
                  byId.put(r.id, r);
                  byName.put(name.toLowerCase(Locale.ROOT), r);
                  if (!xuid.isEmpty()) {
                      byXuid.put(xuid, r);
                  }
                  return r;
              }

              public void join(String name, String xuid) {
                  synchronized (lock) {
                      long now = System.currentTimeMillis();
                      String key = name.toLowerCase(Locale.ROOT);
                      if (online.containsKey(key)) {
                          return;
                      }
                      if (xuid == null) {
                          xuid = "";
                      }
                      Rec r = find(name, xuid);
                      if (r == null) {
                          r = create(name, xuid, now);
                      }
                      Session last = r.ses.isEmpty() ? null : r.ses.get(r.ses.size() - 1);
                      Session cur;
                      if (last != null && now >= last.e && now - last.e <= gapMs) {
                          last.e = now;
                          cur = last;
                      } else {
                          cur = new Session();
                          cur.s = now;
                          cur.e = now;
                          r.ses.add(cur);
                      }
                      Online o = new Online();
                      o.rec = r;
                      o.ses = cur;
                      online.put(key, o);
                      dirty = true;
                  }
              }

              public void quit(String name) {
                  synchronized (lock) {
                      Online o = online.remove(name.toLowerCase(Locale.ROOT));
                      if (o == null) {
                          return;
                      }
                      long now = System.currentTimeMillis();
                      if (now > o.ses.e) {
                          o.ses.e = now;
                      }
                      dirty = true;
                  }
              }

              public void heartbeat() {
                  synchronized (lock) {
                      touch(System.currentTimeMillis());
                  }
              }

              public void closeAll() {
                  synchronized (lock) {
                      long now = System.currentTimeMillis();
                      for (Online o : online.values()) {
                          if (now > o.ses.e) {
                              o.ses.e = now;
                          }
                      }
                      online.clear();
                      dirty = true;
                  }
              }

              private void touch(long now) {
                  for (Online o : online.values()) {
                      if (now > o.ses.e) {
                          o.ses.e = now;
                      }
                      dirty = true;
                  }
              }

              public <T> T read(Function<Calc.Ctx, T> f, Calc.Cfg cfg) {
                  synchronized (lock) {
                      long now = System.currentTimeMillis();
                      touch(now);
                      Set<Rec> on = Collections.newSetFromMap(new IdentityHashMap<Rec, Boolean>());
                      for (Online o : online.values()) {
                          on.add(o.rec);
                      }
                      Calc.Ctx c = new Calc.Ctx(new ArrayList<>(all), on, now, startedAt, cfg);
                      return f.apply(c);
                  }
              }

              public void save() {
                  synchronized (ioLock) {
                      String json;
                      synchronized (lock) {
                          if (!dirty) {
                              return;
                          }
                          Root root = new Root();
                          root.startedAt = startedAt;
                          root.nextId = nextId;
                          root.players = new ArrayList<>(all);
                          json = gson.toJson(root);
                          dirty = false;
                      }
                      try {
                          File parent = file.getParentFile();
                          if (parent != null && !parent.exists()) {
                              parent.mkdirs();
                          }
                          File tmp = new File(file.getPath() + ".tmp");
                          try (OutputStream o = new FileOutputStream(tmp)) {
                              o.write(json.getBytes(StandardCharsets.UTF_8));
                              o.flush();
                          }
                          try {
                              Files.move(tmp.toPath(), file.toPath(),
                                      StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING);
                          } catch (Throwable t) {
                              Files.move(tmp.toPath(), file.toPath(), StandardCopyOption.REPLACE_EXISTING);
                          }
                      } catch (Throwable t) {
                          synchronized (lock) {
                              dirty = true;
                          }
                      }
                  }
              }
          }
          EOF_STORE

          cat > src/main/java/ru/eclips/statsmenu/Calc.java <<'EOF_CALC'
          package ru.eclips.statsmenu;

          import java.time.ZoneId;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Set;

          public class Calc {

              public static final long HOUR = 3600000L;
              public static final long DAY = 86400000L;

              public static class Cfg {
                  public int returning = 3;
                  public int loyal = 20;
                  public int inactiveDays = 7;
                  public long graceMs = 24L * HOUR;
                  public ZoneId zone = ZoneId.systemDefault();
                  public ZoneId msk = ZoneId.of("Europe/Moscow");
                  public int winStart = 7;
                  public int winEnd = 22;
                  public int primeHours = 2;
                  public int peakPct = 90;
              }

              public static class Row {
                  public int id;
                  public String name;
                  public String line;
              }

              public static class Ctx {
                  public final List<Store.Rec> recs;
                  public final Set<Store.Rec> online;
                  public final long now;
                  public final long startedAt;
                  public final Cfg cfg;

                  public Ctx(List<Store.Rec> recs, Set<Store.Rec> online, long now, long startedAt, Cfg cfg) {
                      this.recs = recs;
                      this.online = online;
                      this.now = now;
                      this.startedAt = startedAt;
                      this.cfg = cfg;
                  }

                  public boolean isOn(Store.Rec r) {
                      return online.contains(r);
                  }

                  public double elapsedDays() {
                      return Math.max(0L, now - startedAt) / (double) DAY;
                  }

                  public double eff(int p) {
                      return Math.max(1.0, Math.min((double) p, elapsedDays()));
                  }

                  public int blocks(int p) {
                      int n = (int) Math.ceil(elapsedDays());
                      if (n < 1) {
                          n = 1;
                      }
                      return Math.min(p, n);
                  }
              }

              private static class Item {
                  final Store.Rec r;
                  final long v;
                  final String line;

                  Item(Store.Rec r, long v, String line) {
                      this.r = r;
                      this.v = v;
                      this.line = line;
                  }
              }

              private static class Stable {
                  int elig = 0;
                  int nb = 1;
                  boolean dayMode = true;
                  List<Store.Rec> list = new ArrayList<>();
              }

              // ---------- вспомогательные функции ----------

              private static long total(Store.Rec r) {
                  long t = 0;
                  for (Store.Session s : r.ses) {
                      t += Math.max(0L, s.e - s.s);
                  }
                  return t;
              }

              private static long inWin(Store.Rec r, long from, long to) {
                  long t = 0;
                  for (Store.Session s : r.ses) {
                      long a = Math.max(s.s, from);
                      long b = Math.min(s.e, to);
                      if (b > a) {
                          t += b - a;
                      }
                  }
                  return t;
              }

              private static boolean active(Store.Rec r, long from, long to) {
                  for (Store.Session s : r.ses) {
                      if (s.s < to && s.e >= from) {
                          return true;
                      }
                  }
                  return false;
              }

              private static long lastEnd(Store.Rec r) {
                  return r.ses.isEmpty() ? r.first : r.ses.get(r.ses.size() - 1).e;
              }

              private static long longest(Store.Rec r) {
                  long m = 0;
                  for (Store.Session s : r.ses) {
                      m = Math.max(m, s.e - s.s);
                  }
                  return m;
              }

              private static long avgSes(Store.Rec r) {
                  return r.ses.isEmpty() ? 0L : total(r) / r.ses.size();
              }

              private static long firstDur(Store.Rec r) {
                  if (r.ses.isEmpty()) {
                      return 0L;
                  }
                  Store.Session s = r.ses.get(0);
                  return Math.max(0L, s.e - s.s);
              }

              private static boolean firstDone(Store.Rec r, Ctx c) {
                  return !r.ses.isEmpty() && !(c.isOn(r) && r.ses.size() == 1);
              }

              private static boolean isBounce(Store.Rec r, Ctx c) {
                  return r.ses.size() == 1 && !c.isOn(r) && c.now - lastEnd(r) >= c.cfg.graceMs;
              }

              private static boolean isInactive(Store.Rec r, Ctx c) {
                  return !c.isOn(r) && c.now - lastEnd(r) >= c.cfg.inactiveDays * DAY;
              }

              private static Stable stable(int p, Ctx c) {
                  Stable st = new Stable();
                  int nb = (p <= 1) ? 1 : c.blocks(p);
                  st.nb = nb;
                  st.dayMode = nb <= 1;
                  for (Store.Rec r : c.recs) {
                      if (st.dayMode) {
                          st.elig++;
                          if (active(r, c.now - DAY, c.now)) {
                              st.list.add(r);
                          }
                      } else if (r.first <= c.now - nb * DAY) {
                          st.elig++;
                          boolean all = true;
                          for (int i = 0; i < nb; i++) {
                              if (!active(r, c.now - (i + 1) * DAY, c.now - i * DAY)) {
                                  all = false;
                                  break;
                              }
                          }
                          if (all) {
                              st.list.add(r);
                          }
                      }
                  }
                  return st;
              }

              private static int activeDays(Store.Rec r, int nb, Ctx c) {
                  int k = 0;
                  for (int i = 0; i < nb; i++) {
                      if (active(r, c.now - (i + 1) * DAY, c.now - i * DAY)) {
                          k++;
                      }
                  }
                  return k;
              }

              private static String h(String s) {
                  return "§l§3" + s + "§r\n";
              }

              private static String b(String s) {
                  return "§l" + s + "§r";
              }

              private static String note(Ctx c) {
                  double d = c.elapsedDays();
                  if (d >= 30.0) {
                      return "";
                  }
                  return "\n§3Данные копятся с " + Fmt.date(c.startedAt, c.cfg.zone)
                          + " (" + Fmt.f1(d) + " дн.), поэтому средние считаются по фактическим дням.§r";
              }

              private static String basic(Store.Rec r) {
                  return r.ses.size() + " сесс. · ср. " + Fmt.dur(avgSes(r)) + " · всего " + Fmt.dur(total(r));
              }

              // ---------- публичный интерфейс ----------

              public static String pname(int p) {
                  if (p == 1) {
                      return "день";
                  }
                  if (p == 7) {
                      return "неделю";
                  }
                  if (p == 30) {
                      return "месяц";
                  }
                  return "всё время";
              }

              public static String listBtn(int p) {
                  return p < 0 ? "Список ников" : "Ники за " + pname(p);
              }

              public static String title(int m, Cfg cfg) {
                  switch (m) {
                      case 1:
                          return "Новые игроки в день";
                      case 2:
                          return "Время в первый заход";
                      case 3:
                          return "Зашли 1 раз и не вернулись";
                      case 4:
                          return "Вернулись " + cfg.returning + "+ раз";
                      case 5:
                          return "Вернулись " + cfg.loyal + "+ раз";
                      case 6:
                          return "Уникальные заходы в день";
                      case 7:
                          return "Часов онлайн в день";
                      case 8:
                          return "Заходят каждый день";
                      case 10:
                          return "Онлайн " + pad(cfg.winStart) + "–" + pad(cfg.winEnd) + " МСК";
                      case 11:
                          return "Пик онлайна";
                      case 12:
                          return "Прайм-тайм";
                      default:
                          return "Не заходят " + cfg.inactiveDays + "+ дн.";
                  }
              }

              public static int[] periods(int m) {
                  switch (m) {
                      case 1:
                      case 6:
                      case 7:
                      case 8:
                          return new int[]{1, 7, 30};
                      case 2:
                          return new int[]{1, 7, 30, 0};
                      case 10:
                      case 11:
                      case 12:
                          return new int[]{1, 7, 30};
                      default:
                          return new int[]{-1};
                  }
              }

              public static String text(int m, Ctx c) {
                  switch (m) {
                      case 1:
                          return t1(c);
                      case 2:
                          return t2(c);
                      case 3:
                          return t3(c);
                      case 4:
                          return loyalText("Вернулись " + c.cfg.returning + "+ раз", c.cfg.returning, c);
                      case 5:
                          return loyalText("Вернулись " + c.cfg.loyal + "+ раз", c.cfg.loyal, c);
                      case 6:
                          return t6(c);
                      case 7:
                          return t7(c);
                      case 8:
                          return t8(c);
                      default:
                          return t9(c);
                      case 10:
                          return t10(c);
                      case 11:
                          return t11(c);
                      case 12:
                          return t12(c);
                  }
              }

              private static String t1(Ctx c) {
                  StringBuilder sb = new StringBuilder(h("Новые игроки"));
                  sb.append("Сколько новых игроков приходит на сервер в среднем за день.\n\n");
                  for (int p : new int[]{1, 7, 30}) {
                      long cut = c.now - p * DAY;
                      int n = 0;
                      for (Store.Rec r : c.recs) {
                          if (r.first >= cut) {
                              n++;
                          }
                      }
                      sb.append(b("За " + pname(p) + ":")).append(" новых ").append(n)
                              .append(", в среднем ").append(b(Fmt.f1(n / c.eff(p)))).append(" в день\n");
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static String t2(Ctx c) {
                  StringBuilder sb = new StringBuilder(h("Время в первый заход"));
                  sb.append("Сколько игрок проводит на сервере в самой первой сессии. Незавершённые первые сессии не учитываются.\n\n");
                  for (int p : new int[]{1, 7, 30, 0}) {
                      long cut = p > 0 ? c.now - p * DAY : 0L;
                      List<Long> d = new ArrayList<>();
                      for (Store.Rec r : c.recs) {
                          if (r.first >= cut && firstDone(r, c)) {
                              d.add(firstDur(r));
                          }
                      }
                      sb.append(b("За " + pname(p) + ":")).append(' ');
                      if (d.isEmpty()) {
                          sb.append("нет данных\n");
                          continue;
                      }
                      long sum = 0;
                      for (long x : d) {
                          sum += x;
                      }
                      Collections.sort(d);
                      long med = d.get(d.size() / 2);
                      sb.append("игроков ").append(d.size()).append(", среднее ").append(b(Fmt.dur(sum / d.size())))
                              .append(", медиана ").append(Fmt.dur(med)).append('\n');
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static String t3(Ctx c) {
                  StringBuilder sb = new StringBuilder(h("Зашли 1 раз и не вернулись"));
                  sb.append("Игроки с одной сессией, которые не появлялись больше ")
                          .append(c.cfg.graceMs / HOUR).append(" ч.\n\n");
                  int n = 0;
                  long tot = 0;
                  for (Store.Rec r : c.recs) {
                      if (isBounce(r, c)) {
                          n++;
                          tot += total(r);
                      }
                  }
                  sb.append(b("Игроков:")).append(' ').append(n).append(" (").append(b(Fmt.pct(n, c.recs.size())))
                          .append(" от ").append(c.recs.size()).append(" в базе)\n");
                  if (n > 0) {
                      sb.append(b("Среднее время в игре:")).append(' ').append(Fmt.dur(tot / n)).append('\n');
                      sb.append(b("Суммарное время:")).append(' ').append(Fmt.dur(tot)).append('\n');
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static String loyalText(String head, int t, Ctx c) {
                  StringBuilder sb = new StringBuilder(h(head));
                  sb.append("Игроки, у которых набралось ").append(t).append(" и более сессий.\n\n");
                  int n = 0;
                  long tot = 0;
                  long ses = 0;
                  for (Store.Rec r : c.recs) {
                      if (r.ses.size() >= t) {
                          n++;
                          tot += total(r);
                          ses += r.ses.size();
                      }
                  }
                  sb.append(b("Игроков:")).append(' ').append(n).append(" (").append(b(Fmt.pct(n, c.recs.size())))
                          .append(" от ").append(c.recs.size()).append(" в базе)\n");
                  if (n > 0 && ses > 0) {
                      sb.append(b("Средняя сессия:")).append(' ').append(Fmt.dur(tot / ses)).append('\n');
                      sb.append(b("Средний общий онлайн на игрока:")).append(' ').append(Fmt.dur(tot / n)).append('\n');
                      sb.append(b("Суммарный онлайн группы:")).append(' ').append(Fmt.dur(tot)).append('\n');
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static String t6(Ctx c) {
                  StringBuilder sb = new StringBuilder(h("Уникальные заходы в день"));
                  sb.append("Сколько разных игроков заходит на сервер в среднем за сутки.\n\n");
                  for (int p : new int[]{1, 7, 30}) {
                      int nb = c.blocks(p);
                      long sum = 0;
                      for (int i = 0; i < nb; i++) {
                          for (Store.Rec r : c.recs) {
                              if (active(r, c.now - (i + 1) * DAY, c.now - i * DAY)) {
                                  sum++;
                              }
                          }
                      }
                      int uniq = 0;
                      for (Store.Rec r : c.recs) {
                          if (active(r, c.now - p * DAY, c.now)) {
                              uniq++;
                          }
                      }
                      sb.append(b("За " + pname(p) + ":")).append(" в среднем ").append(b(Fmt.f1((double) sum / nb)))
                              .append(" в день (всего разных игроков: ").append(uniq).append(")\n");
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

