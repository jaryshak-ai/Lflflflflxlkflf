              // ---------- списки ников ----------

              private static List<Row> toRows(List<Item> items) {
                  Collections.sort(items, new Comparator<Item>() {
                      @Override
                      public int compare(Item a, Item b) {
                          int x = Long.compare(b.v, a.v);
                          if (x != 0) {
                              return x;
                          }
                          return a.r.name.compareToIgnoreCase(b.r.name);
                      }
                  });
                  List<Row> out = new ArrayList<>();
                  for (Item it : items) {
                      Row row = new Row();
                      row.id = it.r.id;
                      row.name = it.r.name;
                      row.line = it.line;
                      out.add(row);
                  }
                  return out;
              }

              public static List<Row> rows(int m, int p, Ctx c) {
                  if (m >= 10) {
                      return rowsTime(m, p, c);
                  }
                  List<Item> items = new ArrayList<>();
                  long now = c.now;
                  long cut = p > 0 ? now - p * DAY : 0L;
                  switch (m) {
                      case 1:
                          for (Store.Rec r : c.recs) {
                              if (r.first >= cut) {
                                  items.add(new Item(r, r.first, "новый: " + Fmt.dateS(r.first, c.cfg.zone)));
                              }
                          }
                          break;
                      case 2:
                          for (Store.Rec r : c.recs) {
                              if (r.first >= cut && firstDone(r, c)) {
                                  items.add(new Item(r, r.first, "1-й заход: " + Fmt.dur(firstDur(r))));
                              }
                          }
                          break;
                      case 3:
                          for (Store.Rec r : c.recs) {
                              if (isBounce(r, c)) {
                                  items.add(new Item(r, lastEnd(r),
                                          "в игре: " + Fmt.dur(total(r)) + " · был " + Fmt.dateS(lastEnd(r), c.cfg.zone)));
                              }
                          }
                          break;
                      case 4:
                          for (Store.Rec r : c.recs) {
                              if (r.ses.size() >= c.cfg.returning) {
                                  items.add(new Item(r, total(r), basic(r)));
                              }
                          }
                          break;
                      case 5:
                          for (Store.Rec r : c.recs) {
                              if (r.ses.size() >= c.cfg.loyal) {
                                  items.add(new Item(r, total(r), basic(r)));
                              }
                          }
                          break;
                      case 6: {
                          int nb = c.blocks(p);
                          for (Store.Rec r : c.recs) {
                              if (active(r, now - p * DAY, now)) {
                                  int k = activeDays(r, nb, c);
                                  items.add(new Item(r, k, "дней с заходом: " + k + " из " + nb));
                              }
                          }
                          break;
                      }
                      case 7:
                          for (Store.Rec r : c.recs) {
                              long w = inWin(r, now - p * DAY, now);
                              if (w > 0) {
                                  items.add(new Item(r, w, "за период: " + Fmt.dur(w)));
                              }
                          }
                          break;
                      case 8: {
                          Stable s = stable(p, c);
                          for (Store.Rec r : s.list) {
                              items.add(new Item(r, total(r), r.ses.size() + " сесс. · всего " + Fmt.dur(total(r))));
                          }
                          break;
                      }
                      default:
                          for (Store.Rec r : c.recs) {
                              if (isInactive(r, c)) {
                                  items.add(new Item(r, now - lastEnd(r),
                                          basic(r) + " · был " + Fmt.dateS(lastEnd(r), c.cfg.zone)));
                              }
                          }
                          break;
                  }
                  return toRows(items);
              }

              // ---------- онлайн по времени суток (МСК) ----------

              private static final long SLOT = 1800000L;
              private static final int SLOTS = 48;

              private static class PeakInfo {
                  double avg = 0;
                  long max = 0;
                  long maxTime = 0;
                  int blocks = 0;
              }

              private static class Prime {
                  boolean ok = false;
                  int startSlot = 0;
                  double avgOnline = 0;
                  int runStart = 0;
                  int runLen = 0;
                  double avgDistinct = 0;
                  int days = 0;
                  List<long[]> wins = new ArrayList<>();
              }

              private static String pad(int v) {
                  return String.format(java.util.Locale.ROOT, "%02d", v);
              }

              private static String hhmm(int slot) {
                  int mins = (slot % SLOTS) * 30;
                  return String.format(java.util.Locale.ROOT, "%02d:%02d", mins / 60, mins % 60);
              }

              private static long offMs(Ctx c) {
                  return c.cfg.msk.getRules().getOffset(java.time.Instant.ofEpochMilli(c.now)).getTotalSeconds() * 1000L;
              }

              private static long dayStart(long t, long off) {
                  return Math.floorDiv(t + off, DAY) * DAY - off;
              }

              private static long rangeFrom(Ctx c, int p) {
                  return Math.max(c.now - p * DAY, c.startedAt);
              }

              private static void addRange(double[] arr, long a, long b, long off) {
                  long t = a;
                  while (t < b) {
                      long local = t + off;
                      int idx = (int) (Math.floorMod(local, DAY) / SLOT);
                      long next = (Math.floorDiv(local, SLOT) + 1) * SLOT - off;
                      long end = Math.min(b, next);
                      arr[idx] += end - t;
                      t = end;
                  }
              }

              private static List<long[]> dayWins(Ctx c, int p) {
                  long off = offMs(c);
                  long from = rangeFrom(c, p);
                  long sh = c.cfg.winStart * HOUR;
                  long eh = c.cfg.winEnd * HOUR;
                  if (eh <= sh) {
                      eh += 24L * HOUR;
                  }
                  List<long[]> out = new ArrayList<>();
                  long ds = dayStart(from, off) - DAY;
                  long de = dayStart(c.now, off);
                  for (long d = ds; d <= de; d += DAY) {
                      long a = Math.max(d + sh, from);
                      long z = Math.min(d + eh, c.now);
                      if (z > a) {
                          out.add(new long[]{a, z});
                      }
                  }
                  return out;
              }

              private static long inWins(Store.Rec r, List<long[]> wins) {
                  long t = 0;
                  for (long[] w : wins) {
                      t += inWin(r, w[0], w[1]);
                  }
                  return t;
              }

              private static long[] peak(Ctx c, long from, long to) {
                  List<long[]> ev = new ArrayList<>();
                  for (Store.Rec r : c.recs) {
                      for (Store.Session s : r.ses) {
                          long a = Math.max(s.s, from);
                          long z = Math.min(s.e, to);
                          if (z > a) {
                              ev.add(new long[]{a, 1L});
                              ev.add(new long[]{z, -1L});
                          }
                      }
                  }
                  Collections.sort(ev, new Comparator<long[]>() {
                      @Override
                      public int compare(long[] x, long[] y) {
                          int k = Long.compare(x[0], y[0]);
                          return k != 0 ? k : Long.compare(x[1], y[1]);
                      }
                  });
                  long cur = 0;
                  long max = 0;
                  long tm = from;
                  for (long[] e : ev) {
                      cur += e[1];
                      if (cur > max) {
                          max = cur;
                          tm = e[0];
                      }
                  }
                  return new long[]{max, tm};
              }

              private static PeakInfo peakInfo(int p, Ctx c) {
                  PeakInfo pi = new PeakInfo();
                  int nb = (p <= 1) ? 1 : c.blocks(p);
                  double sum = 0;
                  int used = 0;
                  for (int i = 0; i < nb; i++) {
                      long to = c.now - i * DAY;
                      long from = Math.max(to - DAY, c.startedAt);
                      if (to <= from) {
                          continue;
                      }
                      long[] pk = peak(c, from, to);
                      sum += pk[0];
                      used++;
                      if (pk[0] > pi.max) {
                          pi.max = pk[0];
                          pi.maxTime = pk[1];
                      }
                  }
                  pi.blocks = used;
                  pi.avg = used > 0 ? sum / used : 0;
                  return pi;
              }

              private static Prime prime(int p, Ctx c) {
                  Prime pr = new Prime();
                  long off = offMs(c);
                  long from = rangeFrom(c, p);
                  if (c.now <= from) {
                      return pr;
                  }
                  double[] pm = new double[SLOTS];
                  double[] cv = new double[SLOTS];
                  addRange(cv, from, c.now, off);
                  for (Store.Rec r : c.recs) {
                      for (Store.Session s : r.ses) {
                          long a = Math.max(s.s, from);
                          long z = Math.min(s.e, c.now);
                          if (z > a) {
                              addRange(pm, a, z, off);
                          }
                      }
                  }
                  int len = c.cfg.primeHours * 2;
                  double best = -1;
                  int bs = -1;
                  for (int k = 0; k < SLOTS; k++) {
                      double sp = 0;
                      double sc = 0;
                      boolean good = true;
                      for (int j = 0; j < len; j++) {
                          int i = (k + j) % SLOTS;
                          if (cv[i] <= 0) {
                              good = false;
                              break;
                          }
                          sp += pm[i];
                          sc += cv[i];
                      }
                      if (!good) {
                          continue;
                      }
                      double avg = sp / sc;
                      if (avg > best) {
                          best = avg;
                          bs = k;
                      }
                  }
                  if (bs < 0 || best <= 0) {
                      return pr;
                  }
                  double pk = -1;
                  int ps = -1;
                  for (int i = 0; i < SLOTS; i++) {
                      if (cv[i] > 0) {
                          double a = pm[i] / cv[i];
                          if (a > pk) {
                              pk = a;
                              ps = i;
                          }
                      }
                  }
                  if (ps < 0 || pk <= 0) {
                      return pr;
                  }
                  double thr = pk * c.cfg.peakPct / 100.0;
                  int left = 0;
                  while (left < SLOTS - 1) {
                      int i = ((ps - left - 1) % SLOTS + SLOTS) % SLOTS;
                      if (cv[i] > 0 && pm[i] / cv[i] >= thr) {
                          left++;
                      } else {
                          break;
                      }
                  }
                  int right = 0;
                  while (left + right < SLOTS - 1) {
                      int i = (ps + right + 1) % SLOTS;
                      if (cv[i] > 0 && pm[i] / cv[i] >= thr) {
                          right++;
                      } else {
                          break;
                      }
                  }
                  pr.ok = true;
                  pr.startSlot = bs;
                  pr.avgOnline = best;
                  pr.runStart = ((ps - left) % SLOTS + SLOTS) % SLOTS;
                  pr.runLen = left + right + 1;

                  long wl = len * SLOT;
                  long ds = dayStart(from, off) - DAY;
                  long de = dayStart(c.now, off);
                  for (long d = ds; d <= de; d += DAY) {
                      long a = d + bs * SLOT;
                      long z = a + wl;
                      if (a >= from && z <= c.now) {
                          pr.wins.add(new long[]{a, z});
                      }
                  }
                  pr.days = pr.wins.size();
                  if (pr.days > 0) {
                      long sum = 0;
                      for (long[] w : pr.wins) {
                          for (Store.Rec r : c.recs) {
                              if (active(r, w[0], w[1])) {
                                  sum++;
                              }
                          }
                      }
                      pr.avgDistinct = (double) sum / pr.days;
                  }
                  return pr;
              }

              private static String t10(Ctx c) {
                  StringBuilder sb = new StringBuilder(h(title(10, c.cfg)));
                  sb.append("Сколько игроков в среднем одновременно онлайн в окне ")
                          .append(pad(c.cfg.winStart)).append(":00–").append(pad(c.cfg.winEnd)).append(":00 по МСК.\n\n");
                  for (int p : new int[]{1, 7, 30}) {
                      List<long[]> wins = dayWins(c, p);
                      long wl = 0;
                      long pm = 0;
                      for (long[] w : wins) {
                          wl += w[1] - w[0];
                      }
                      for (Store.Rec r : c.recs) {
                          pm += inWins(r, wins);
                      }
                      sb.append(b("За " + pname(p) + ":")).append(' ');
                      if (wl <= 0) {
                          sb.append("нет данных\n");
                          continue;
                      }
                      sb.append("в среднем ").append(b(Fmt.f1((double) pm / wl))).append(" игроков онлайн (время окна в периоде: ")
                              .append(Fmt.dur(wl)).append(")\n");
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static String t11(Ctx c) {
                  StringBuilder sb = new StringBuilder(h("Пик онлайна"));
                  sb.append("Максимум игроков, одновременно бывших на сервере. Сутки считаются как 24 часа подряд, время по МСК.\n\n");
                  for (int p : new int[]{1, 7, 30}) {
                      PeakInfo pi = peakInfo(p, c);
                      sb.append(b("За " + pname(p) + ":")).append(' ');
                      if (pi.blocks == 0) {
                          sb.append("нет данных\n");
                          continue;
                      }
                      if (p == 1) {
                          sb.append("пик ").append(b(String.valueOf(pi.max))).append(" игроков одновременно (")
                                  .append(Fmt.dateS(pi.maxTime, c.cfg.msk)).append(" МСК)\n");
                      } else {
                          sb.append("средний дневной пик ").append(b(Fmt.f1(pi.avg))).append(", максимум ")
                                  .append(pi.max).append(" (").append(Fmt.dateS(pi.maxTime, c.cfg.msk)).append(" МСК)\n");
                      }
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static String t12(Ctx c) {
                  StringBuilder sb = new StringBuilder(h("Прайм-тайм"));
                  sb.append("Самые загруженные ").append(c.cfg.primeHours)
                          .append(" ч подряд (по получасовым интервалам, усреднено по дням периода), время по МСК.\n\n");
                  for (int p : new int[]{1, 7, 30}) {
                      Prime pr = prime(p, c);
                      sb.append(b("За " + pname(p) + ":")).append('\n');
                      if (!pr.ok) {
                          sb.append("нет данных\n\n");
                          continue;
                      }
                      int endSlot = (pr.startSlot + c.cfg.primeHours * 2) % SLOTS;
                      sb.append("Прайм-тайм: ").append(b(hhmm(pr.startSlot) + "–" + hhmm(endSlot) + " МСК")).append('\n');
                      sb.append("Онлайн в нём в среднем: ").append(b(Fmt.f1(pr.avgOnline))).append('\n');
                      if (pr.days > 0) {
                          sb.append("Заходит игроков в день: ").append(b(Fmt.f1(pr.avgDistinct)))
                                  .append(" (дней в расчёте: ").append(pr.days).append(")\n");
                      } else {
                          sb.append("Заходит игроков в день: нет данных (мало дней)\n");
                      }
                      sb.append("Онлайн не ниже ").append(c.cfg.peakPct).append("% от пика держится: ");
                      if (pr.runLen >= SLOTS) {
                          sb.append(b("весь день")).append('\n');
                      } else {
                          int runEnd = (pr.runStart + pr.runLen) % SLOTS;
                          sb.append(b(Fmt.dur(pr.runLen * SLOT))).append(" (").append(hhmm(pr.runStart)).append("–")
                                  .append(hhmm(runEnd)).append(" МСК)\n");
                      }
                      sb.append('\n');
                  }
                  sb.append(note(c));
                  return sb.toString();
              }

              private static List<Row> rowsTime(int m, int p, Ctx c) {
                  List<Item> items = new ArrayList<>();
                  if (m == 10) {
                      List<long[]> wins = dayWins(c, p);
                      for (Store.Rec r : c.recs) {
                          long w = inWins(r, wins);
                          if (w > 0) {
                              items.add(new Item(r, w, "в окне: " + Fmt.dur(w)));
                          }
                      }
                  } else if (m == 11) {
                      PeakInfo pi = peakInfo(p, c);
                      if (pi.blocks > 0 && pi.max > 0) {
                          long tm = pi.maxTime;
                          for (Store.Rec r : c.recs) {
                              boolean on = false;
                              for (Store.Session s : r.ses) {
                                  if (s.s <= tm && s.e > tm) {
                                      on = true;
                                      break;
                                  }
                              }
                              if (on) {
                                  items.add(new Item(r, total(r), "в пик · всего " + Fmt.dur(total(r))));
                              }
                          }
                      }
                  } else {
                      Prime pr = prime(p, c);
                      if (pr.ok) {
                          for (Store.Rec r : c.recs) {
                              long w = inWins(r, pr.wins);
                              if (w > 0) {
                                  items.add(new Item(r, w, "в прайме: " + Fmt.dur(w)));
                              }
                          }
                      }
                  }
                  return toRows(items);
              }

              // ---------- карточка игрока ----------

              public static String card(Store.Rec r, Ctx c) {
                  StringBuilder sb = new StringBuilder();
                  sb.append(b("Первый заход:")).append(' ').append(Fmt.date(r.first, c.cfg.zone)).append('\n');
                  sb.append(b("Последний заход:")).append(' ')
                          .append(c.isOn(r) ? "сейчас онлайн" : Fmt.date(lastEnd(r), c.cfg.zone)).append('\n');
                  sb.append(b("Сессий:")).append(' ').append(r.ses.size()).append('\n');
                  sb.append(b("Средняя сессия:")).append(' ').append(Fmt.dur(avgSes(r))).append('\n');
                  sb.append(b("Самая длинная сессия:")).append(' ').append(Fmt.dur(longest(r))).append('\n');
                  sb.append(b("Первая сессия:")).append(' ').append(Fmt.dur(firstDur(r))).append('\n');
                  sb.append(b("Общий онлайн:")).append(' ').append(Fmt.dur(total(r))).append('\n');
                  sb.append(b("Онлайн за 7 дней:")).append(' ').append(Fmt.dur(inWin(r, c.now - 7 * DAY, c.now))).append('\n');
                  if (!r.ses.isEmpty()) {
                      sb.append("\n").append(b("Последние сессии:")).append('\n');
                      int stop = Math.max(0, r.ses.size() - 5);
                      for (int i = r.ses.size() - 1; i >= stop; i--) {
                          Store.Session s = r.ses.get(i);
                          sb.append(Fmt.date(s.s, c.cfg.zone)).append(" · ").append(Fmt.dur(s.e - s.s)).append('\n');
                      }
                  }
                  return sb.toString();
              }
          }
          EOF_CALC

          cat > src/main/java/ru/eclips/statsmenu/StatsPlugin.java <<'EOF_MAIN'
          package ru.eclips.statsmenu;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.event.player.PlayerJoinEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.form.element.ElementButton;
          import cn.nukkit.form.response.FormResponseSimple;
          import cn.nukkit.form.window.FormWindowSimple;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.utils.Config;

          import java.io.File;
          import java.time.ZoneId;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;
          import java.util.function.Function;

          public class StatsPlugin extends PluginBase implements Listener {

              private static class Screen {
                  String title = "";
                  String content = "";
                  final List<String> labels = new ArrayList<>();
                  final List<Runnable> acts = new ArrayList<>();

                  void btn(String label, Runnable action) {
                      labels.add("§l§0" + label);
                      acts.add(action);
                  }
              }

              private static class Ui {
                  final int formId;
                  final List<Runnable> acts;

                  Ui(int formId, List<Runnable> acts) {
                      this.formId = formId;
                      this.acts = acts;
                  }
              }

              private Store store;
              private ExecutorService pool;
              private final Calc.Cfg cfg = new Calc.Cfg();
              private final Set<String> exclude = new HashSet<>();
              private final Map<UUID, Ui> ui = new ConcurrentHashMap<>();
              private int pageSize = 10;

              private static int clamp(int v, int lo, int hi) {
                  return Math.max(lo, Math.min(hi, v));
              }

              private void dbg(Throwable t) {
                  try {
                      getLogger().warning("[StatsMenu] " + t);
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public void onEnable() {
                  try {
                      getDataFolder().mkdirs();
                  } catch (Throwable ignored) {
                  }
                  try {
                      saveDefaultConfig();
                  } catch (Throwable t) {
                      dbg(t);
                  }

                  int mergeSec = 60;
                  int saveSec = 60;
                  try {
                      Config conf = getConfig();
                      mergeSec = clamp(conf.getInt("session-merge-seconds", 60), 0, 3600);
                      saveSec = clamp(conf.getInt("save-interval-seconds", 60), 10, 3600);
                      cfg.returning = clamp(conf.getInt("returning-sessions", 3), 2, 100000);
                      cfg.loyal = clamp(conf.getInt("loyal-sessions", 20), 2, 100000);
                      cfg.graceMs = clamp(conf.getInt("bounce-grace-hours", 24), 1, 24 * 365) * Calc.HOUR;
                      cfg.inactiveDays = clamp(conf.getInt("inactive-days", 7), 1, 3650);
                      cfg.winStart = clamp(conf.getInt("day-window-start-hour", 7), 0, 23);
                      cfg.winEnd = clamp(conf.getInt("day-window-end-hour", 22), 1, 24);
                      cfg.primeHours = clamp(conf.getInt("prime-length-hours", 2), 1, 12);
                      cfg.peakPct = clamp(conf.getInt("prime-peak-threshold-percent", 90), 50, 100);
                      String mz = conf.getString("msk-zone", "Europe/Moscow");
                      if (mz != null && !mz.trim().isEmpty()) {
                          try {
                              cfg.msk = ZoneId.of(mz.trim());
                          } catch (Throwable ignored) {
                          }
                      }
                      pageSize = clamp(conf.getInt("page-size", 10), 3, 20);
                      List<String> ex = conf.getStringList("exclude-names");
                      if (ex != null) {
                          for (String s : ex) {
                              if (s != null && !s.trim().isEmpty()) {
                                  exclude.add(s.trim().toLowerCase(Locale.ROOT));
                              }
                          }
                      }
                      String tz = conf.getString("timezone", "");
                      if (tz != null && !tz.trim().isEmpty()) {
                          try {
                              cfg.zone = ZoneId.of(tz.trim());
                          } catch (Throwable ignored) {
                          }
                      }
                  } catch (Throwable t) {
                      dbg(t);
                  }

                  store = new Store(new File(getDataFolder(), "stats.json"));
                  store.setGapMs(mergeSec * 1000L);
                  try {
                      store.load();
                  } catch (Throwable t) {
                      dbg(t);
                  }

                  pool = Executors.newSingleThreadExecutor(r -> {
                      Thread th = new Thread(r, "StatsMenu-worker");
                      th.setDaemon(true);
                      return th;
                  });

                  getServer().getPluginManager().registerEvents(this, this);

                  try {
                      for (Player p : getServer().getOnlinePlayers().values()) {
                          track(p);
                      }
                  } catch (Throwable t) {
                      dbg(t);
                  }

                  int ticks = saveSec * 20;
                  getServer().getScheduler().scheduleDelayedRepeatingTask(this, () -> {
                      try {
                          store.heartbeat();
                          pool.execute(() -> store.save());
                      } catch (Throwable t) {
                          dbg(t);
                      }
                  }, ticks, ticks);
              }

              @Override
              public void onDisable() {
                  try {
                      if (store != null) {
                          store.closeAll();
                      }
                  } catch (Throwable t) {
                      dbg(t);
                  }
                  try {
                      if (pool != null) {
                          pool.shutdown();
                          pool.awaitTermination(5, TimeUnit.SECONDS);
                      }
                  } catch (Throwable t) {
                      dbg(t);
                  }
                  try {
                      if (store != null) {
                          store.save();
                      }
                  } catch (Throwable t) {
                      dbg(t);
                  }
              }

              // ---------- учёт сессий ----------

              private static String xuid(Player p) {
                  try {
                      String x = p.getLoginChainData().getXUID();
                      return x == null ? "" : x;
                  } catch (Throwable t) {
                      return "";
                  }
              }

              private void track(Player p) {
                  try {
                      String n = p.getName();
                      if (n == null || n.isEmpty() || exclude.contains(n.toLowerCase(Locale.ROOT))) {
                          return;
                      }
                      store.join(n, xuid(p));
                  } catch (Throwable t) {
                      dbg(t);
                  }
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent e) {
                  track(e.getPlayer());
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  try {
                      Player p = e.getPlayer();
                      ui.remove(p.getUniqueId());
                      String n = p.getName();
                      if (n != null) {
                          store.quit(n);
                      }
                  } catch (Throwable t) {
                      dbg(t);
                  }
              }

              // ---------- команда ----------

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (!command.getName().equalsIgnoreCase("ss")) {
                      return false;
                  }
                  if (!(sender instanceof Player)) {
                      sender.sendMessage("§lКоманда /ss доступна только в игре.");
                      return true;
                  }
                  if (!sender.hasPermission("ss.use")) {
                      sender.sendMessage("§l§cУ вас нет доступа к этой команде.");
                      return true;
                  }
                  menu((Player) sender);
                  return true;
              }

              // ---------- формы ----------

              private void show(Player p, Screen s) {
                  if (p == null || !p.isOnline()) {
                      return;
                  }
                  FormWindowSimple w = new FormWindowSimple(s.title, s.content);
                  for (String label : s.labels) {
                      w.addButton(new ElementButton(label));
                  }
                  int id = p.showFormWindow(w);
                  ui.put(p.getUniqueId(), new Ui(id, s.acts));
              }

              private void go(Player p, Function<Calc.Ctx, Screen> f) {
                  try {
                      pool.execute(() -> {
                          try {
                              Screen s = store.read(f, cfg);
                              getServer().getScheduler().scheduleTask(this, () -> {
                                  try {
                                      show(p, s);
                                  } catch (Throwable t) {
                                      dbg(t);
                                  }
                              });
                          } catch (Throwable t) {
                              dbg(t);
                          }
                      });
                  } catch (Throwable t) {
                      dbg(t);
                  }
              }

              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  try {
                      Player p = e.getPlayer();
                      Ui u = ui.get(p.getUniqueId());
                      if (u == null || u.formId != e.getFormID()) {
                          return;
                      }
                      ui.remove(p.getUniqueId());
                      if (e.wasClosed() || !(e.getResponse() instanceof FormResponseSimple)) {
                          return;
                      }
                      int idx = ((FormResponseSimple) e.getResponse()).getClickedButtonId();
                      if (idx < 0 || idx >= u.acts.size()) {
                          return;
                      }
                      final Runnable act = u.acts.get(idx);
                      getServer().getScheduler().scheduleDelayedTask(this, () -> {
                          try {
                              act.run();
                          } catch (Throwable t) {
                              dbg(t);
                          }
                      }, 1);
                  } catch (Throwable t) {
                      dbg(t);
                  }
              }

              private void menu(Player p) {
                  go(p, c -> {
                      Screen s = new Screen();
                      s.title = "§lСтатистика сервера";
                      s.content = "§lИгроков в базе:§r " + c.recs.size()
                              + "\n§lСейчас онлайн:§r " + c.online.size()
                              + "\n§lДанные ведутся с:§r " + Fmt.date(c.startedAt, c.cfg.zone)
                              + "\n\nВыберите показатель:";
                      for (int m = 1; m <= 12; m++) {
                          final int mm = m;
                          s.btn(m + ". " + Calc.title(m, c.cfg), () -> metric(p, mm));
                      }
                      return s;
                  });
              }

              private void metric(Player p, int m) {
                  go(p, c -> {
                      Screen s = new Screen();
                      s.title = "§l" + Calc.title(m, c.cfg);
                      s.content = Calc.text(m, c);
                      for (int per : Calc.periods(m)) {
                          final int pp = per;
                          s.btn(Calc.listBtn(pp), () -> list(p, m, pp, 0));
                      }
                      s.btn("Назад", () -> menu(p));
                      return s;
                  });
              }

              private void list(Player p, int m, int per, int page) {
                  go(p, c -> {
                      List<Calc.Row> rows = Calc.rows(m, per, c);
                      int size = pageSize;
                      int pages = Math.max(1, (rows.size() + size - 1) / size);
                      final int pg = Math.min(Math.max(page, 0), pages - 1);

                      Screen s = new Screen();
                      s.title = "§l" + Calc.title(m, c.cfg) + (per >= 0 ? " (" + Calc.pname(per) + ")" : "");
                      if (rows.isEmpty()) {
                          s.content = "Список пуст.";
                      } else {
                          s.content = "§lВсего игроков:§r " + rows.size()
                                  + "\n§lСтраница:§r " + (pg + 1) + " из " + pages
                                  + "\nНажмите на ник, чтобы открыть карточку игрока.";
                      }
                      int from = pg * size;
                      int to = Math.min(rows.size(), from + size);
                      for (int i = from; i < to; i++) {
                          Calc.Row r = rows.get(i);
                          final int id = r.id;
                          s.btn(r.name + "\n§l§0" + r.line, () -> card(p, id, m, per, pg));
                      }
                      if (pg > 0) {
                          s.btn("Предыдущая страница", () -> list(p, m, per, pg - 1));
                      }
                      if (pg < pages - 1) {
                          s.btn("Следующая страница", () -> list(p, m, per, pg + 1));
                      }
                      s.btn("К показателю", () -> metric(p, m));
                      s.btn("Главное меню", () -> menu(p));
                      return s;
                  });
              }

              private void card(Player p, int id, int m, int per, int pg) {
                  go(p, c -> {
                      Store.Rec found = null;
                      for (Store.Rec x : c.recs) {
                          if (x.id == id) {
                              found = x;
                              break;
                          }
                      }
                      Screen s = new Screen();
                      if (found == null) {
                          s.title = "§lИгрок";
                          s.content = "Игрок не найден.";
                      } else {
                          s.title = "§l" + found.name;
                          s.content = Calc.card(found, c);
                      }
                      s.btn("Назад к списку", () -> list(p, m, per, pg));
                      s.btn("Главное меню", () -> menu(p));
                      return s;
                  });
              }
          }
          EOF_MAIN

      - name: Build plugin
        working-directory: statsmenu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MVN_OPTS="-B -ntp -U -Daether.connector.connectTimeout=15000 -Daether.connector.requestTimeout=60000"
          ok=0

          try_build() {
            echo "=== Пробую $1:$2:$3 (лимит $4 сек) ==="
            timeout "$4" mvn $MVN_OPTS clean package -Dnukkit.group="$1" -Dnukkit.artifact="$2" -Dnukkit.version="$3"
          }

          # Вариант 1: Nukkit-MOT из репозитория Lanink (если он тормозит, через 4 минуты идём дальше)
          if try_build cn.nukkit Nukkit MOT-SNAPSHOT 240; then ok=1; fi

          # Вариант 2: jar Nukkit-MOT из GitHub Releases
          if [ "$ok" = "0" ]; then
            echo "=== Вариант 2: jar Nukkit-MOT из GitHub Releases ==="
            URL=$(curl -s --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MemoriesOfTime/Nukkit-MOT/releases/latest | grep browser_download_url | grep '\.jar' | grep -vi sources | head -n 1 | cut -d '"' -f 4 || true)
            echo "URL: $URL"
            if [ -n "$URL" ]; then
              if curl -sL --max-time 180 -o nukkit-local.jar "$URL" && \
                 timeout 240 mvn $MVN_OPTS install:install-file -Dfile=nukkit-local.jar -DgroupId=cn.nukkit -DartifactId=nukkit-local -Dversion=local -Dpackaging=jar -DgeneratePom=true && \
                 try_build cn.nukkit nukkit-local local 240; then
                ok=1
              fi
            fi
          fi

          # Вариант 3: JitPack (собирает Nukkit-MOT из GitHub, может занять несколько минут)
          if [ "$ok" = "0" ]; then
            if try_build com.github.MemoriesOfTime Nukkit-MOT master-SNAPSHOT 600; then ok=1; fi
          fi

          # Вариант 4: обычный Nukkit из репозитория OpenCollab
          if [ "$ok" = "0" ]; then
            if try_build cn.nukkit nukkit 1.0-SNAPSHOT 240; then ok=1; fi
          fi

          if [ "$ok" = "0" ]; then
            echo "Не удалось получить Nukkit API ни одним способом"
            exit 1
          fi
          ls -la target/*.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: StatsMenu
          path: statsmenu/target/StatsMenu.jar
          if-no-files-found: error
